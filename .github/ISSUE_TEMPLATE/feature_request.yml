name: Feature request
description: Propose a new command, lever, or report
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What decision would this help you make?
      description: >
        This is a measurement tool. A feature earns its place by changing what
        someone does, not by adding a number to a report.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: measurable
    attributes:
      label: How would we know it is correct?
      description: What test or measurement would prove the output is right?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: See CONTRIBUTING.md. These are hard rules, not preferences.
      options:
        - label: This needs no new runtime dependency.
        - label: This needs no network call outside `adder/sources.py`.
        - label: This writes nothing under `~/.claude/`.
