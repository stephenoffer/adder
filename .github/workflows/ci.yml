name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: test py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The tool reads paths under the user's home dir, so the two other
          # platforms get a spot check rather than the full version matrix.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # `transcripts` tests need real Claude Code sessions on the machine.
        run: python -m pytest -m "not transcripts" --cov=adder --cov-report=xml
      - name: CLI smoke
        shell: bash
        run: |
          python -m adder version
          python -m adder help > /dev/null
          # Read the command list from the dispatcher so this cannot drift.
          for c in $(python -c "from adder.cli import COMMANDS; print(' '.join(c.name for c in COMMANDS))"); do
            python -m adder "$c" --help > /dev/null || { echo "FAIL: adder $c --help"; exit 1; }
          done
      - name: Offline guarantee
        shell: bash
        # Nothing outside adder/sources.py may open a socket. This asserts it
        # rather than trusting review to catch a stray import.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          NET = {"urllib", "http", "socket", "requests", "httpx", "ftplib", "smtplib"}
          bad = []
          for f in sorted(pathlib.Path("adder").rglob("*.py")):
              if f.name == "sources.py":
                  continue
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods = [node.module]
                  for m in mods:
                      if m.split(".")[0] in NET:
                          bad.append(f"{f}:{node.lineno}: imports {m}")
          if bad:
              print("network import outside adder/sources.py:")
              print("\n".join(bad))
              sys.exit(1)
          print("offline guarantee holds")
          PY

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Wheel carries package data
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = ["adder/cli.py", "adder/__main__.py", "adder/py.typed"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"missing from {whl}: {missing}")
          print(f"{whl} ok ({len(names)} entries)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
