name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: test py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The tool reads paths under the user's home dir, so the two other
          # platforms get a spot check rather than the full version matrix.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # `transcripts` tests need real Claude Code sessions on the machine.
        run: python -m pytest -m "not transcripts" --cov=adder --cov-report=xml
      - name: CLI smoke
        shell: bash
        run: |
          python -m adder version
          python -m adder help > /dev/null
          # Read the command list from the dispatcher so this cannot drift.
          for c in $(python -c "from adder.cli import COMMANDS; print(' '.join(c.name for c in COMMANDS))"); do
            python -m adder "$c" --help > /dev/null || { echo "FAIL: adder $c --help"; exit 1; }
          done
      - name: Offline guarantee
        shell: bash
        # Nothing outside adder/pricing/sources.py may open a socket. This asserts it
        # rather than trusting review to catch a stray import.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          NET = {"urllib", "http", "socket", "requests", "httpx", "ftplib", "smtplib"}
          bad = []
          for f in sorted(pathlib.Path("adder").rglob("*.py")):
              if f.name == "sources.py":
                  continue
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods = [node.module]
                  for m in mods:
                      if m.split(".")[0] in NET:
                          bad.append(f"{f}:{node.lineno}: imports {m}")
          if bad:
              print("network import outside adder/pricing/sources.py:")
              print("\n".join(bad))
              sys.exit(1)
          print("offline guarantee holds")
          PY

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Wheel carries package data
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          # The dispatcher is a package, not a module: this asked for
          # `adder/cli.py`, which the layer split turned into `adder/cli/`, and
          # the job failed on every build after it. Data files are listed too --
          # setuptools ships only .py files unless package-data names them, and
          # that failure is invisible from a checkout, where the file is there.
          required = [
              "adder/__main__.py",
              "adder/cli/__init__.py",
              "adder/cli/commands.py",
              "adder/py.typed",
              "adder/pricing/data/catalog.json",
          ]
          missing = [r for r in required if r not in names]
          if not any(n.startswith("adder/decide/agents/") and n.endswith(".md")
                     for n in names):
              missing.append("adder/decide/agents/*.md")
          if missing:
              sys.exit(f"missing from {whl}: {missing}")
          print(f"{whl} ok ({len(names)} entries)")
          PY
      - name: The wheel installs and runs like a PyPI install
        # A name check inside the zip proves the file was packed. It does not
        # prove `pip install adder-cli` gives a working tool: a subpackage
        # missing from `packages.find`, a broken entry point, or a data file the
        # code cannot locate once it is in site-packages all pass that check and
        # fail the user. So install it for real, from outside the checkout.
        env:
          ADDER_OFFLINE: "1"
        run: |
          set -euo pipefail
          # Resolved before the `cd` below, not after it.
          WHL="$(ls "$PWD"/dist/*.whl)"
          python -m venv /tmp/whl-env
          /tmp/whl-env/bin/python -m pip install --quiet "$WHL"
          # `cd /tmp` matters: in the checkout `import adder` finds the source
          # tree, and every one of these checks would pass on a broken wheel.
          cd /tmp
          test "$(/tmp/whl-env/bin/python -c 'import adder,os;print(os.path.dirname(adder.__file__))')" \
            != "$GITHUB_WORKSPACE/adder"
          /tmp/whl-env/bin/adder version
          /tmp/whl-env/bin/adder help > /dev/null
          for c in $(/tmp/whl-env/bin/python -c "from adder.cli import COMMANDS; print(' '.join(c.name for c in COMMANDS))"); do
            /tmp/whl-env/bin/adder "$c" --help > /dev/null || { echo "FAIL: adder $c --help"; exit 1; }
          done
          /tmp/whl-env/bin/adder models list --limit 1 > /dev/null
          # Everything that is not a .py file, checked where `pip install` put
          # it. This is the check the four releases that shipped an inert
          # activation payload would have failed. `models list` above is not
          # that check: without the bundled snapshot it falls back to nine
          # built-in models and still exits 0.
          /tmp/whl-env/bin/python - <<'PY'
          from adder.pricing.catalog import BUNDLED
          from adder.decide.auto import AGENTS, HOOKS, agents_dir, hooks_dir
          missing = [] if BUNDLED.is_file() else [str(BUNDLED)]
          missing += [a for a in AGENTS if not (agents_dir() / a).is_file()]
          missing += [str(h["script"]) for h in HOOKS
                      if not (hooks_dir() / str(h["script"])).is_file()]
          if missing:
              raise SystemExit(f"installed wheel is missing package data: {missing}")
          print(f"package data present in site-packages ({BUNDLED.stat().st_size:,} B catalog)")
          PY
      - name: The sdist installs too
        # pip falls back to the sdist whenever the wheel does not apply, and the
        # sdist is built by a different code path -- MANIFEST.in, not
        # package-data. The two have disagreed before.
        env:
          ADDER_OFFLINE: "1"
        run: |
          set -euo pipefail
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet "$SDIST"
          cd /tmp
          /tmp/sdist-env/bin/adder version
          /tmp/sdist-env/bin/adder models list --limit 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
