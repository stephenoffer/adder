name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (leave off for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Refuse to cut a release whose tag and code disagree about the version.
  guard:
    name: verify tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          VERSION=$(python -c "import adder; print(adder.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "adder.__version__ = $VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match adder.__version__ $VERSION"
              exit 1
            fi
            if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
              exit 1
            fi
            echo "tag, version, and CHANGELOG agree"
          fi

  test:
    name: full test matrix
    needs: [guard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -m "not transcripts"

  build:
    name: build
    needs: [guard, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The exact artifacts that go to PyPI install and run
        # Not a duplicate of the CI job: that one gates `main`, this one gates
        # the files that are actually uploaded. They are built by separate runs
        # and only one of them is published.
        env:
          ADDER_OFFLINE: "1"
        run: |
          set -euo pipefail
          WHL="$(ls "$PWD"/dist/*.whl)"
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          for art in "$WHL" "$SDIST"; do
            rm -rf /tmp/rel-env
            python -m venv /tmp/rel-env
            /tmp/rel-env/bin/python -m pip install --quiet "$art"
            # Outside the checkout, or `import adder` finds the source tree.
            (cd /tmp && /tmp/rel-env/bin/adder version && \
                        /tmp/rel-env/bin/adder help > /dev/null)
            /tmp/rel-env/bin/python - <<'PY'
          from adder.pricing.catalog import BUNDLED
          from adder.decide.auto import AGENTS, HOOKS, agents_dir, hooks_dir
          missing = [] if BUNDLED.is_file() else [str(BUNDLED)]
          missing += [a for a in AGENTS if not (agents_dir() / a).is_file()]
          missing += [str(h["script"]) for h in HOOKS
                      if not (hooks_dir() / str(h["script"])).is_file()]
          if missing:
              raise SystemExit(f"artifact is missing package data: {missing}")
          PY
            echo "  $(basename "$art") ok"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: github release
    needs: [guard, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract this version's changelog section
        run: |
          python - <<'PY' > RELEASE_NOTES.md
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          print((m.group(1).strip() if m else f"Release {version}.") or f"Release {version}.")
          PY
          cat RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

  pypi:
    name: publish to pypi
    needs: [guard, build]
    # Runs on a tag push, or on a manual dispatch with the box ticked.
    # Until the `pypi` environment and a PyPI trusted publisher exist, this job
    # is the only thing that fails — the GitHub release above still ships.
    if: github.ref_type == 'tag' || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adder-cli
    permissions:
      id-token: write   # OIDC for trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
