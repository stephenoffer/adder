[build-system]
# 77, not 68: `license = "MIT"` and `license-files` below are PEP 639, and
# setuptools only understood them from 77.0.0. Under 76.1.0 the build dies on
# `project.license must be valid exactly by one definition` -- which nobody saw,
# because pip's isolated build env resolves the newest setuptools and the floor
# is never exercised. It is exercised by anyone who installs the sdist with
# `--no-build-isolation`, and a floor that cannot build the project is a lie
# about what this package needs. `tests/repo/test_invariants.py` pins it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is `adder-cli` because PyPI's `adder` is held by an
# abandoned 2014 package. The import name and the console script are both
# plain `adder`; only `pip install` says `adder-cli`. See docs/naming.md.
name = "adder-cli"
description = "What a Claude Code session actually costs, and what each fix is worth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Stephen Offer" }]
keywords = ["claude", "claude-code", "llm", "cost", "tokens", "context", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Zero runtime dependencies is a feature, not an oversight: the tool reads local
# transcript files and computes. Adding one needs a note in CONTRIBUTING.md.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # tomllib is 3.11+; the repo-invariant tests parse pyproject.toml on 3.10 too.
    "tomli>=2; python_version < '3.11'",
    "pytest-cov>=4",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/stephenoffer/adder"
Repository = "https://github.com/stephenoffer/adder"
Changelog = "https://github.com/stephenoffer/adder/blob/main/CHANGELOG.md"
Issues = "https://github.com/stephenoffer/adder/issues"

[project.scripts]
adder = "adder.cli:run"

[tool.setuptools]
include-package-data = true

# Discovered rather than listed: the package is a tree now, and a hand-written
# list is a list that silently loses a subpackage the day someone adds one --
# the checkout keeps working and only the wheel is broken.
[tool.setuptools.packages.find]
include = ["adder*"]
namespaces = false

# The bundled catalog snapshot and the typing marker are data the wheel must
# carry; without this setuptools ships only .py files and
# `adder/pricing/data/catalog.json` vanishes at install time while working fine
# from a checkout. The snapshot sits under `pricing` because `catalog.py` owns
# it; keep the two together if either moves.
[tool.setuptools.package-data]
adder = ["py.typed"]
"adder.pricing" = ["data/*.json"]
# The agent definitions `adder auto on` installs. Not code, so nothing here
# includes them by inference -- and without them activation writes the hooks and
# silently skips the delegation half of the saving `adder bench` reports.
# `TestWhatTheWheelCarries` in tests/repo/test_invariants.py asserts every file
# `auto.AGENTS` names is covered by a glob here, because the failure is a quiet one.
"adder.decide" = ["agents/*.md"]

[tool.setuptools.dynamic]
version = { attr = "adder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--import-mode=importlib` is what lets the test tree mirror the package tree:
# without it two test modules may not share a basename, and
# `tests/cli/test_dispatch.py` and `tests/decide/test_dispatch.py` are both the
# obvious name for the module they cover.
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
filterwarnings = ["error"]
markers = [
    "transcripts: needs real Claude Code transcripts on this machine; skipped in CI",
]

[tool.coverage.run]
source = ["adder"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".claude/plans"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "TID",  # tidy imports -- see ban-relative-imports below
    "N",    # pep8 naming
    "ISC",  # implicit string concatenation
    "PIE",  # unnecessary code
    "D100", # every module has a docstring; CLAUDE.md says what it must contain
]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # function call in default arg -- intentional in a few table defs
    "SIM108", # ternary-vs-if is a readability call, not a rule
    # Single-capital locals are the formula's own symbols: `R` is a rate, `W` a
    # window, `E` an expectation. The cost model is derived in the docstring
    # above the function and the code is meant to read as that derivation.
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",
    "N803", "N806",  # tests restate the formula's symbols; see N806 above
    # Test names are sentences, and a sentence about `ValueError` should say
    # `ValueError`. The rule buys nothing in a file where no name is called.
    "N802",
]

[tool.ruff.lint.isort]
known-first-party = ["adder"]
# Style rule from CLAUDE.md, enforced rather than remembered. Postponed
# annotation evaluation is what lets modules type-annotate against each other
# without paying an import at module load, which the lazy-dispatch design needs.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports everywhere inside the package. In a tree this deep a
# relative import reads as `from ...pricing.cost import turn_cost`, where the
# number of dots is load-bearing and invisible; `from adder.pricing.cost import
# turn_cost` says where the code lives no matter which file you are reading it
# in, and survives the file being moved.
ban-relative-imports = "all"

# The formatter is deliberately NOT a gate (see the Makefile): several tables in
# `pricing` are hand-aligned into columns and the formatter destroys that. These
# settings exist so that if someone does run it, it agrees with the code.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

